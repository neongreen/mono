name: conf

on:
  push:
    paths:
      - "conf/**"
      - ".github/workflows/conf.yml"
  pull_request:
    paths:
      - "conf/**"
      - ".github/workflows/conf.yml"

jobs:
  fmt:
    runs-on: ubuntu-latest
    # Make this check optional - it won't block PRs
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: "1.24.7"
          cache-dependency-path: go.sum

      - name: Download dependencies
        working-directory: conf
        run: go mod download

      - name: Format check
        working-directory: conf
        run: |
          go fmt ./...
          git diff --exit-code

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: "1.24.7"
          cache-dependency-path: go.sum

      - name: Download dependencies
        working-directory: conf
        run: go mod download

      - name: Run tests with coverage
        working-directory: conf
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic 2>&1 | tee test-output.txt

      - name: Display coverage summary
        if: always()
        working-directory: conf
        run: |
          {
            echo "## Code Coverage Summary"
            echo ""
            echo "### Per-Package Coverage"
            echo "\`\`\`"
            grep "^ok.*coverage:" test-output.txt | awk '{
              pkg = $2
              for (i = 1; i <= NF; i++) {
                if ($i ~ /^[0-9.]+%$/) {
                  cov = $i
                  break
                }
              }
              printf "%-65s %s\n", pkg, cov
            }'
            echo "\`\`\`"
            echo ""
            echo "### Overall Summary"
            echo "\`\`\`"
            go tool cover -func=coverage.out | tail -1
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: conf-coverage-report
          path: conf/coverage.out
          retention-days: 30

      - name: Build
        working-directory: conf
        run: go build -v -o conf-binary ./cmd
