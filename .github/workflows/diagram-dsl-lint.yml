name: diagram-dsl lint

on:
  push:
    branches:
      - main
    paths:
      - 'diagram-dsl/**'
      - '.github/workflows/diagram-dsl-lint.yml'
  pull_request:
    paths:
      - 'diagram-dsl/**'
      - '.github/workflows/diagram-dsl-lint.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    # Make this check optional - it won't block PRs
    continue-on-error: true
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: diagram-dsl/package-lock.json
      
      - name: Install dependencies
        working-directory: diagram-dsl
        run: npm ci
      
      - name: Run layout linter
        working-directory: diagram-dsl
        run: npm run lint:ci
        continue-on-error: true
