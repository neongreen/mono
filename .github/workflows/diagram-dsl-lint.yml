name: diagram-dsl lint

on:
  push:
    branches:
      - main
    paths:
      - "diagram-dsl/**"
      - ".github/workflows/diagram-dsl-lint.yml"
  pull_request:
    paths:
      - "diagram-dsl/**"
      - ".github/workflows/diagram-dsl-lint.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    # Make this check optional - it won't block PRs
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: diagram-dsl/package-lock.json

      - name: Install dependencies
        working-directory: diagram-dsl
        run: npm ci

      - name: Run layout linter
        working-directory: diagram-dsl
        run: npm run lint:ci
        continue-on-error: true
