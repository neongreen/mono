name: diagram-dsl lint

on:
  push:
    branches:
      - main
    paths:
      - "diagram-dsl/**"
      - ".github/workflows/diagram-dsl-lint.yml"
  pull_request:
    paths:
      - "diagram-dsl/**"
      - ".github/workflows/diagram-dsl-lint.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    # Make this check optional - it won't block PRs
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Set up Node.js
        uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: diagram-dsl/package-lock.json

      - name: Install dependencies
        working-directory: diagram-dsl
        run: npm ci

      - name: Run layout linter
        working-directory: diagram-dsl
        run: npm run lint:ci
        continue-on-error: true
