name: diagram-dsl

on:
  push:
    paths:
      - 'diagram-dsl/**'
      - '.github/workflows/diagram-dsl.yml'
  pull_request:
    paths:
      - 'diagram-dsl/**'
      - '.github/workflows/diagram-dsl.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        working-directory: diagram-dsl
        run: npm ci
      
      - name: Run linter
        working-directory: diagram-dsl
        run: npm run lint
  
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        working-directory: diagram-dsl
        run: npm ci
      
      - name: Run tests
        working-directory: diagram-dsl
        run: npm run test:lint
  
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        working-directory: diagram-dsl
        run: npm ci
      
      - name: Build
        working-directory: diagram-dsl
        run: npm run build
