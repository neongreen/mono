name: dissect

on:
  push:
    paths:
      - 'dissect/**'
      - '.github/workflows/dissect.yml'
  pull_request:
    paths:
      - 'dissect/**'
      - '.github/workflows/dissect.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.7'
      
      - name: Install gopls
        run: go install golang.org/x/tools/gopls@latest
      
      - name: Run tests
        working-directory: dissect
        run: go test ./... -v
