name: fslog

on:
  push:
    paths:
      - "lib/fslog/**"
      - ".github/workflows/fslog.yml"
  pull_request:
    paths:
      - "lib/fslog/**"
      - ".github/workflows/fslog.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: "1.24.7"
          cache-dependency-path: go.sum

      - name: Download dependencies
        working-directory: lib/fslog
        run: go mod download

      - name: Format check
        working-directory: lib/fslog
        run: |
          go fmt ./...
          git diff --exit-code

      - name: Run tests
        working-directory: lib/fslog
        run: go test -v -race ./...
