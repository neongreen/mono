name: Go Workspace Lint

on:
  push:
    branches:
      - main
    paths:
      - "go.work"
      - "go.work.sum"
      - "**/go.mod"
      - "**/go.sum"
      - "lib/**"
      - "scripts/lint-go-workspace.py"
      - ".github/workflows/go-workspace-lint.yml"
  pull_request:
    paths:
      - "go.work"
      - "go.work.sum"
      - "**/go.mod"
      - "**/go.sum"
      - "lib/**"
      - "scripts/lint-go-workspace.py"
      - ".github/workflows/go-workspace-lint.yml"

jobs:
  workspace-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: "1.24.7"

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@22695119d769bdb6f7032ad67b9bca0ef8c4a174 # v5.4.0

      - name: Check for local replace directives in modules
        run: |
          echo "Checking that individual modules don't have local replace directives..."
          echo "(All replace directives should be in go.work)"

          # Find all go.mod files except go.work
          if grep -r "^replace github.com/neongreen/mono/" --include="go.mod" --exclude="go.work" .; then
            echo "Error: Found local replace directives in individual modules"
            echo "All replace directives should be in go.work, not in individual go.mod files"
            exit 1
          fi

          echo "✓ No local replace directives found in individual modules"

      - name: Validate workspace consistency
        run: |
          uv run scripts/lint-go-workspace.py

      - name: Verify go work sync succeeds
        run: |
          export GOPRIVATE=github.com/neongreen/mono
          export GONOSUMDB=github.com/neongreen/mono
          go work sync

          # Check if go work sync modified any files
          if ! git diff --quiet; then
            echo "Error: go work sync modified files"
            echo "Run 'mise run //:go:tidy-all' locally and commit the changes"
            git diff
            exit 1
          fi

          echo "✓ Workspace is properly synchronized"
