name: ingest

on:
  push:
    paths:
      - "ingest/**"
      - ".github/workflows/ingest.yml"
  pull_request:
    paths:
      - "ingest/**"
      - ".github/workflows/ingest.yml"

env:
  MISE_EXPERIMENTAL: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    # Make this check optional - it won't block PRs
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: "1.24.7"
          cache-dependency-path: go.sum

      - name: Format check
        working-directory: ingest
        run: |
          go fmt ./...
          git diff --exit-code

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: "1.24.7"
          cache-dependency-path: go.sum

      - name: Install mise
        uses: jdx/mise-action@e3d7b8d67a7958d1207f6ed871e83b1ea780e7b0 # v3.3.1

      - name: Run unit tests
        run: mise run //ingest:test

      - name: Run integration suites
        run: mise run //ingest:test:integration
