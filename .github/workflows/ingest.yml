name: ingest

on:
  push:
    paths:
      - "ingest/**"
      - ".github/workflows/ingest.yml"
  pull_request:
    paths:
      - "ingest/**"
      - ".github/workflows/ingest.yml"

env:
  MISE_EXPERIMENTAL: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    # Make this check optional - it won't block PRs
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: "1.24.7"
          cache-dependency-path: go.sum

      - name: Format check
        working-directory: ingest
        run: |
          go fmt ./...
          git diff --exit-code

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: "1.24.7"
          cache-dependency-path: go.sum

      - name: Install mise
        uses: jdx/mise-action@e3d7b8d67a7958d1207f6ed871e83b1ea780e7b0 # v3.3.1

      - name: Run unit tests with coverage
        working-directory: ingest
        run: go test ./... -coverprofile=coverage.out -covermode=atomic 2>&1 | tee test-output.txt

      - name: Run integration suites
        run: mise run //ingest:test:integration

      - name: Display coverage summary
        if: always()
        working-directory: ingest
        run: |
          {
            echo "## Code Coverage Summary"
            echo ""
            echo "### Per-Package Coverage"
            echo "\`\`\`"
            grep "^ok.*coverage:" test-output.txt | awk '{
              pkg = $2
              for (i = 1; i <= NF; i++) {
                if ($i ~ /^[0-9.]+%$/) {
                  cov = $i
                  break
                }
              }
              printf "%-65s %s\n", pkg, cov
            }'
            echo "\`\`\`"
            echo ""
            echo "### Overall Summary"
            echo "\`\`\`"
            go tool cover -func=coverage.out | tail -1
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ingest-coverage-report
          path: ingest/coverage.out
          retention-days: 30
