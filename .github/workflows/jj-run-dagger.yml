name: jj-run-dagger

on:
  push:
    paths:
      - "jj-run/**"
      - ".dagger/**"
      - ".github/workflows/jj-run-dagger.yml"
  pull_request:
    paths:
      - "jj-run/**"
      - ".dagger/**"
      - ".github/workflows/jj-run-dagger.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Run jj-run tests with Dagger
        uses: dagger/dagger-for-github@d809c269da643e2a9e56163b6d295c75ecb05f7a # v8.2.0
        with:
          version: "0.19.4"
          verb: call
          args: jj-run-tests --format=testname
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}

      - name: Display test summary
        if: success()
        run: |
          {
            echo "## ✅ Test Results"
            echo ""
            echo "jj-run tests completed successfully using Dagger."
            echo ""
            echo "**Test Environment:**"
            echo "- Container: \`golang:1.24.7\`"
            echo "- Test runner: \`gotestsum\`"
            echo "- Format: \`testname\`"
            echo "- Dagger version: \`0.19.4\`"
            echo "- jj version: \`v0.34.0\`"
          } >> "$GITHUB_STEP_SUMMARY"
