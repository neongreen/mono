name: jj-run

on:
  push:
    paths:
      - "jj-run/**"
      - ".github/workflows/jj-run.yml"
  pull_request:
    paths:
      - "jj-run/**"
      - ".github/workflows/jj-run.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"

      - name: Install mise
        uses: jdx/mise-action@f8dfbcc150159126838e44b882bf34bd98fd90f3 # v2.1.0
        with:
          version: 2024.1.0

      - name: Install jujutsu
        run: |
          # Install jj from GitHub releases
          curl -L https://github.com/martinvonz/jj/releases/download/v0.23.0/jj-v0.23.0-x86_64-unknown-linux-musl.tar.gz | tar xz
          sudo mv jj /usr/local/bin/
          jj --version

      - name: Run tests
        working-directory: jj-run
        run: mise run test
