name: jj-run

on:
  push:
    paths:
      - "jj-run/**"
      - ".github/workflows/jj-run.yml"
  pull_request:
    paths:
      - "jj-run/**"
      - ".github/workflows/jj-run.yml"

env:
  MISE_EXPERIMENTAL: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: '1.24.7'
          cache-dependency-path: jj-run/go.sum

      - name: Install mise
        uses: jdx/mise-action@e3d7b8d67a7958d1207f6ed871e83b1ea780e7b0 # v3.3.1

      - name: Install jujutsu
        run: |
          # Install jj from GitHub releases
          curl -L https://github.com/martinvonz/jj/releases/download/v0.23.0/jj-v0.23.0-x86_64-unknown-linux-musl.tar.gz | tar xz
          sudo mv jj /usr/local/bin/
          jj --version

      - name: Run tests
        run: mise run //jj-run:test
