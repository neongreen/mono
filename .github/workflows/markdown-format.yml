name: markdown-format

on:
  push:
    paths:
      - 'markdown-format/**'
  pull_request:
    paths:
      - 'markdown-format/**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.7'
          cache-dependency-path: markdown-format/go.sum
      
      - name: Run tests
        working-directory: markdown-format
        run: go test -v
