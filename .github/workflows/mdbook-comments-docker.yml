name: mdbook-comments-docker

on:
  push:
    paths:
      - 'mdbook-comments/**'
      - '.github/workflows/mdbook-comments-docker.yml'
    branches:
      - main
  pull_request:
    paths:
      - 'mdbook-comments/**'
      - '.github/workflows/mdbook-comments-docker.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/mdbook-comments-demo

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./mdbook-comments
          file: ./mdbook-comments/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./mdbook-comments
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./mdbook-comments
        run: npx playwright install --with-deps chromium

      - name: Build Docker image for testing
        working-directory: ./mdbook-comments
        run: docker build -t mdbook-comments-demo:test .

      - name: Run Playwright tests
        working-directory: ./mdbook-comments
        run: npm test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: mdbook-comments/playwright-report/
          retention-days: 30
