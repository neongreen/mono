name: mdbook-comments

on:
  push:
    paths:
      - "mdbook-comments/**"
      - ".github/workflows/mdbook-comments.yml"
  pull_request:
    paths:
      - "mdbook-comments/**"
      - ".github/workflows/mdbook-comments.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@7b1c307e0dcbda6122208f10795a713336d9b35a # v1.83.0
        with:
          toolchain: 1.90

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890697e6cf56d9684ba # v2.7.3

      - name: Check formatting
        working-directory: mdbook-comments
        run: cargo fmt --check

      - name: Run clippy
        working-directory: mdbook-comments
        run: cargo clippy -- -D warnings

      - name: Run Rust tests
        working-directory: mdbook-comments
        run: cargo test

      - name: Build release
        working-directory: mdbook-comments
        run: cargo build --release

      - name: Install mdbook
        run: cargo install mdbook --version 0.4.52

      - name: Build example book
        working-directory: mdbook-comments/example-book
        run: |
          rm -rf book
          PATH="../target/release:$PATH" mdbook build

      - name: Set up Node.js
        uses: actions/setup-node@3796a29107c9370c35c1b5e6ca4cc6a0ff25ac1d # v4.2.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mdbook-comments/package-lock.json

      - name: Install npm dependencies
        working-directory: mdbook-comments
        run: npm ci

      - name: Install Playwright browsers
        working-directory: mdbook-comments
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: mdbook-comments
        run: npm test

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@5604c14e7ad6bb49b77f2549c19af15935ba78cf # v4.6.0
        with:
          name: playwright-results
          path: |
            mdbook-comments/test-results/
            mdbook-comments/playwright-report/
          retention-days: 7
