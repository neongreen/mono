name: printpdf

on:
  push:
    paths:
      - 'printpdf/**'
      - '.github/workflows/printpdf.yml'
  pull_request:
    paths:
      - 'printpdf/**'
      - '.github/workflows/printpdf.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.7'
      
      - name: Run tests
        working-directory: printpdf
        run: go test ./... -v
