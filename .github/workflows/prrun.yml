name: prrun

on:
  push:
    paths:
      - 'prrun/**'
      - '.github/workflows/prrun.yml'
  pull_request:
    paths:
      - 'prrun/**'
      - '.github/workflows/prrun.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.7'
          cache-dependency-path: prrun/go.sum
      
      - name: Run tests
        working-directory: prrun
        run: go test ./... -v
