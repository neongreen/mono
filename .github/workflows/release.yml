name: Release Go Projects

on:
  push:
    branches:
      - main
    paths:
      - "**/*.go"
      - "**/go.mod"
      - "**/go.sum"
      - ".github/workflows/release.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**/*.go"
      - "**/go.mod"
      - "**/go.sum"
      - ".github/workflows/release.yml"

jobs:
  # First job: detect which Go projects need releases
  detect:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.find-projects.outputs.projects }}
      has_projects: ${{ steps.find-projects.outputs.has_projects }}
      mirror_projects: ${{ steps.mirror-config.outputs.projects }}
      mirror_metadata: ${{ steps.mirror-config.outputs.metadata }}
      mirror_repo: ${{ steps.mirror-config.outputs.repo }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find Go projects
        id: find-projects
        run: |
          # Get list of changed files
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            # For PRs, compare against the base branch
            CHANGED_FILES=$(git diff --name-only origin/${{ github.event.pull_request.base.ref }}...HEAD)
          else
            # For push to main, compare against previous commit
            # Handle initial commit or when before SHA is all zeros
            BEFORE_SHA="${{ github.event.before }}"
            if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
              # First commit or forced push - get all files in current commit
              CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r ${{ github.sha }})
            else
              CHANGED_FILES=$(git diff --name-only $BEFORE_SHA...${{ github.sha }})
            fi
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Find all directories with go.mod at root level
          all_projects=()
          for dir in */; do
            dir=${dir%/}
            if [ -f "$dir/go.mod" ]; then
              # Check if there's a main.go somewhere in the project
              if find "$dir" -name "main.go" | grep -q .; then
                all_projects+=("$dir")
              fi
            fi
          done

          echo "All Go projects: ${all_projects[*]}"

          # Filter projects to only those with changed files
          projects=()
          for project in "${all_projects[@]}"; do
            # Check if any changed file is in this project directory
            if echo "$CHANGED_FILES" | grep -q "^$project/"; then
              projects+=("$project")
              echo "Project $project has changes"
            fi
          done

          # Convert to JSON array
          if [ ${#projects[@]} -eq 0 ]; then
            echo "has_projects=false" >> $GITHUB_OUTPUT
            echo "projects=[]" >> $GITHUB_OUTPUT
            echo "No projects with changes found"
          else
            projects_json=$(printf '%s\n' "${projects[@]}" | jq -R . | jq -s -c .)
            echo "has_projects=true" >> $GITHUB_OUTPUT
            echo "projects=$projects_json" >> $GITHUB_OUTPUT
            echo "Projects with changes: ${projects[*]}"
          fi
      - name: Load release mirror config
        id: mirror-config
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import tomllib

          data = tomllib.loads(Path("release-mirror.toml").read_text())
          mirror = data.get("mirror", {})
          projects = []
          metadata = {}

          for entry in mirror.get("projects", []):
              name = entry.get("name")
              if not name:
                  continue
              projects.append(name)
              metadata[name] = entry

          output = os.environ["GITHUB_OUTPUT"]
          with open(output, "a", encoding="utf-8") as fh:
              fh.write(f"projects={json.dumps(projects)}\n")
              fh.write(f"metadata={json.dumps(metadata)}\n")
              fh.write(f"repo={mirror.get('public_repo', '')}\n")
          PY

  # Second job: build and release each project
  release:
    needs: detect
    if: needs.detect.outputs.has_projects == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: ${{ fromJson(needs.detect.outputs.projects) }}

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.7"
          cache-dependency-path: ${{ matrix.project }}/go.sum

      - name: Determine version and branch
        id: version
        run: |
          PROJECT="${{ matrix.project }}"

          # Determine branch/ref name
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            # For PRs, use pr-NUMBER format
            REF="pr-${{ github.event.pull_request.number }}"
          else
            # For push to main
            REF="main"
          fi

          # Sanitize ref name (replace / with -)
          REF_SAFE=$(echo "$REF" | tr '/' '-')

          # Find existing tags for this project+ref combination
          TAG_PREFIX="${PROJECT}--${REF_SAFE}."
          EXISTING_TAGS=$(git tag -l "${TAG_PREFIX}*" | sort -V)

          if [ -z "$EXISTING_TAGS" ]; then
            # No existing tags, start with .1
            VERSION_NUM=1
          else
            # Get the highest version number
            LAST_TAG=$(echo "$EXISTING_TAGS" | tail -1)
            LAST_NUM=$(echo "$LAST_TAG" | sed "s|${TAG_PREFIX}||")
            VERSION_NUM=$((LAST_NUM + 1))
          fi

          TAG="${PROJECT}--${REF_SAFE}.${VERSION_NUM}"
          VERSION="${REF_SAFE}.${VERSION_NUM}"

          echo "project=$PROJECT" >> $GITHUB_OUTPUT
          echo "ref=$REF" >> $GITHUB_OUTPUT
          echo "ref_safe=$REF_SAFE" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_num=$VERSION_NUM" >> $GITHUB_OUTPUT

          echo "Building ${PROJECT} version ${VERSION} (tag: ${TAG})"

      - name: Build binaries
        id: build
        run: |
          PROJECT="${{ matrix.project }}"
          VERSION="${{ steps.version.outputs.version }}"

          # Find main.go location(s)
          MAIN_FILES=$(find "$PROJECT" -name "main.go")

          # Determine build targets
          # If there's cmd/main.go, build from cmd
          # Otherwise build the main.go in root
          if echo "$MAIN_FILES" | grep -q "cmd/main.go"; then
            BUILD_TARGET="./cmd"
          else
            BUILD_TARGET="."
          fi

          mkdir -p dist
          DIST_DIR="$(pwd)/dist"

          # Build for multiple platforms
          PLATFORMS=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
          )

          for platform in "${PLATFORMS[@]}"; do
            IFS='/' read -r GOOS GOARCH <<< "$platform"

            OUTPUT_NAME="${PROJECT}-${VERSION}-${GOOS}-${GOARCH}"

            echo "Building for $GOOS/$GOARCH..."

            # Set ldflags for version information
            BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            LDFLAGS="-X main.Version=${VERSION} -X main.GitCommit=${{ github.sha }} -X main.BuildTime=${BUILD_TIME}"

            (cd "$PROJECT" && GOOS=$GOOS GOARCH=$GOARCH go build -ldflags="$LDFLAGS" -o "$DIST_DIR/$OUTPUT_NAME" $BUILD_TARGET)

            if [ $? -ne 0 ]; then
              echo "Failed to build for $GOOS/$GOARCH"
              exit 1
            fi

            echo "Built: dist/$OUTPUT_NAME"
          done

          ls -lh dist/

      - name: Package Homebrew archives
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(fromJson(needs.detect.outputs.mirror_projects), matrix.project) }}
        run: |
          set -euo pipefail
          PROJECT="${{ matrix.project }}"
          VERSION="${{ steps.version.outputs.version }}"

          for binary in dist/${PROJECT}-${VERSION}-*; do
            if [[ ! -f "$binary" ]]; then
              continue
            fi
            if [[ "$binary" == *.tar.gz ]]; then
              continue
            fi

            platform=${binary#dist/${PROJECT}-${VERSION}-}
            tmpdir=$(mktemp -d)
            cp "$binary" "$tmpdir/${PROJECT}"
            tarball="dist/${PROJECT}-${VERSION}-${platform}.tar.gz"
            (
              cd "$tmpdir"
              tar -czf "$OLDPWD/$tarball" "${PROJECT}"
            )
            rm -rf "$tmpdir"
            echo "Created $tarball"
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "${{ matrix.project }} ${{ steps.version.outputs.version }}"
          body: |
            Release of **${{ matrix.project }}** version `${{ steps.version.outputs.version }}`

            Built from: ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || 'main branch' }}
            Commit: ${{ github.sha }}

            ## Installation

            Download the appropriate binary for your platform, make it executable, and move it to your PATH:

            ```bash
            # Linux AMD64
            wget https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/${{ matrix.project }}-${{ steps.version.outputs.version }}-linux-amd64
            chmod +x ${{ matrix.project }}-${{ steps.version.outputs.version }}-linux-amd64
            sudo mv ${{ matrix.project }}-${{ steps.version.outputs.version }}-linux-amd64 /usr/local/bin/${{ matrix.project }}

            # macOS ARM64 (M1/M2)
            wget https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/${{ matrix.project }}-${{ steps.version.outputs.version }}-darwin-arm64
            chmod +x ${{ matrix.project }}-${{ steps.version.outputs.version }}-darwin-arm64
            sudo mv ${{ matrix.project }}-${{ steps.version.outputs.version }}-darwin-arm64 /usr/local/bin/${{ matrix.project }}
            ```

            ## Available Binaries

            - Linux: amd64, arm64
            - macOS: amd64 (Intel), arm64 (Apple Silicon)
          files: dist/*
          draft: false
          prerelease: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror release to public repository
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(fromJson(needs.detect.outputs.mirror_projects), matrix.project) }}
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ needs.detect.outputs.mirror_repo }}
          tag_name: ${{ steps.version.outputs.tag }}
          name: "${{ matrix.project }} ${{ steps.version.outputs.version }}"
          body: |
            Release of **${{ matrix.project }}** version `${{ steps.version.outputs.version }}`

            Built from: ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || 'main branch' }}
            Commit: ${{ github.sha }}

            ## Installation

            Download the appropriate binary for your platform, make it executable, and move it to your PATH:

            ```bash
            # Linux AMD64
            wget https://github.com/${{ needs.detect.outputs.mirror_repo }}/releases/download/${{ steps.version.outputs.tag }}/${{ matrix.project }}-${{ steps.version.outputs.version }}-linux-amd64
            chmod +x ${{ matrix.project }}-${{ steps.version.outputs.version }}-linux-amd64
            sudo mv ${{ matrix.project }}-${{ steps.version.outputs.version }}-linux-amd64 /usr/local/bin/${{ matrix.project }}

            # macOS ARM64 (M1/M2)
            wget https://github.com/${{ needs.detect.outputs.mirror_repo }}/releases/download/${{ steps.version.outputs.tag }}/${{ matrix.project }}-${{ steps.version.outputs.version }}-darwin-arm64
            chmod +x ${{ matrix.project }}-${{ steps.version.outputs.version }}-darwin-arm64
            sudo mv ${{ matrix.project }}-${{ steps.version.outputs.version }}-darwin-arm64 /usr/local/bin/${{ matrix.project }}
            ```

            ## Available Binaries

            - Linux: amd64, arm64
            - macOS: amd64 (Intel), arm64 (Apple Silicon)
          files: dist/*
          draft: false
          prerelease: false
          allow_updates: true
          fail_on_unmatched_files: true
          overwrite: true
          token: ${{ secrets.PUBLIC_RELEASE_TOKEN }}

      - name: Checkout Homebrew tap repository
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(fromJson(needs.detect.outputs.mirror_projects), matrix.project) }}
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.detect.outputs.mirror_repo }}
          token: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          path: tap

      - name: Set up Homebrew
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(fromJson(needs.detect.outputs.mirror_projects), matrix.project) }}
        uses: Homebrew/actions/setup-homebrew@v4

      - name: Update Homebrew formula
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(fromJson(needs.detect.outputs.mirror_projects), matrix.project) }}
        working-directory: tap
        env:
          PROJECT: ${{ matrix.project }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          MIRROR_REPO: ${{ needs.detect.outputs.mirror_repo }}
          MIRROR_METADATA: ${{ needs.detect.outputs.mirror_metadata }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import textwrap

          project = os.environ["PROJECT"]
          version = os.environ["VERSION"]
          tag = os.environ["TAG"]
          mirror_repo = os.environ["MIRROR_REPO"]
          metadata = json.loads(os.environ["MIRROR_METADATA"])

          project_meta = metadata.get(project, {})
          binary_name = project_meta.get("binary", project)

          def escape(value: str) -> str:
              return value.replace("\\", "\\\\").replace("\"", "\\\"")

          desc = escape(project_meta.get("desc", f"{project} CLI"))
          homepage = escape(project_meta.get("homepage", f"https://github.com/{mirror_repo}"))
          test_args = project_meta.get("test_args", ["--help"])

          class_name = project_meta.get("formula_class")
          if not class_name:
              class_name = "".join(part.capitalize() for part in project.split("-"))

          dist_dir = Path(os.getcwd()).parent / "dist"
          artifacts = {}

          for archive in dist_dir.glob(f"{project}-{version}-*.tar.gz"):
              platform = archive.stem.split(f"{project}-{version}-", 1)[1]
              digest = hashlib.sha256(archive.read_bytes()).hexdigest()
              artifacts[platform] = {
                  "filename": archive.name,
                  "sha256": digest,
              }

          if not artifacts:
              raise SystemExit(f"No packaged Homebrew archives found for {project}")

          def url_for(filename: str) -> str:
              return f"https://github.com/{mirror_repo}/releases/download/{tag}/{filename}"

          def block_for(os_name: str, arch: str) -> str:
              key = f"{os_name}-{arch}"
              entry = artifacts.get(key)
              if not entry:
                  return ""
              return textwrap.dedent(
                  f"""
                    url "{url_for(entry['filename'])}"
                    sha256 "{entry['sha256']}"
                  """
              ).strip()

          mac_blocks = {
              "arm64": block_for("darwin", "arm64"),
              "amd64": block_for("darwin", "amd64"),
          }
          linux_blocks = {
              "arm64": block_for("linux", "arm64"),
              "amd64": block_for("linux", "amd64"),
          }

          def arch_if(block: str, arch_name: str) -> str:
              if not block:
                  return ""
              cpu_method = "arm?" if arch_name == "arm64" else "intel?"
              indented = block.replace("\n", "\n      ")
              return textwrap.dedent(
                  f"""
                  if Hardware::CPU.{cpu_method}
                    {indented}
                  end
                  """
              ).strip()

          def os_block(os_name: str, blocks: dict) -> str:
              parts = []
              for arch_name, block in blocks.items():
                  if not block:
                      continue
                  stanza = arch_if(block, arch_name)
                  if stanza:
                      parts.append(textwrap.indent(stanza, "  "))
              if not parts:
                  return ""
              joined = "\n".join(parts)
              return textwrap.dedent(
                  f"""
                on_{os_name} do
              {joined}
                end
              """
              ).rstrip()

          test_args_ruby = ", ".join([f'"{arg}"' for arg in test_args]) if test_args else '"--help"'

          formula_body = textwrap.dedent(
              f"""
              class {class_name} < Formula
                desc "{desc}"
                homepage "{homepage}"
                version "{version}"
              """
          ).rstrip()

          os_sections = []
          mac_section = os_block("macos", mac_blocks)
          if mac_section:
              os_sections.append(mac_section)
          linux_section = os_block("linux", linux_blocks)
          if linux_section:
              os_sections.append(linux_section)

          if os_sections:
              formula_body += "\n" + "\n".join(os_sections)

          install_block = textwrap.dedent(
              f"""
                def install
                  bin.install "{binary_name}"
                end

                test do
                  system "#{{bin}}/{binary_name}", {test_args_ruby}
                end
          end
              """
          )

          formula_body += "\n" + install_block

          formula_dir = Path("Formula")
          formula_dir.mkdir(parents=True, exist_ok=True)
          formula_path = formula_dir / f"{project}.rb"
          formula_path.write_text(formula_body, encoding="utf-8")
          PY

      - name: Run brew audit
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(fromJson(needs.detect.outputs.mirror_projects), matrix.project) }}
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew tap-new --no-git neongreen/mono-public || true
          TAP_DIR="$(brew --repository)/Library/Taps/neongreen/homebrew-mono-public"
          rm -rf "$TAP_DIR"
          ln -s "${GITHUB_WORKSPACE}/tap" "$TAP_DIR"
          brew audit --formula neongreen/mono-public/${{ matrix.project }}

      - name: Commit Homebrew tap update
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(fromJson(needs.detect.outputs.mirror_projects), matrix.project) }}
        working-directory: tap
        env:
          PROJECT: ${{ matrix.project }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -e
          git config user.name "mono-release-bot"
          git config user.email "mono-release-bot@example.com"
          git fetch origin
          git checkout main
          git pull --rebase origin main
          git add Formula/${PROJECT}.rb
          if git diff --staged --quiet; then
            echo "No Homebrew changes to commit"
            exit 0
          fi
          git commit -m "brew: update ${PROJECT} to ${VERSION}"
          git push origin HEAD:main
