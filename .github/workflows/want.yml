name: want

on:
  push:
    paths:
      - "want/**"
      - ".github/workflows/want.yml"
  pull_request:
    paths:
      - "want/**"
      - ".github/workflows/want.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.24.7"
          cache-dependency-path: want/go.sum

      - name: Run tests
        working-directory: want
        run: go test ./... -v
