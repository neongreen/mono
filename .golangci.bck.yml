linters:
  enable-all: true
  disable:
    # Deprecated linters
    - execinquery
    - gomnd
    - exportloopref
    
    # Overly strict or opinionated linters
    - depguard  # Would need project-specific configuration
    - varnamelen  # Too strict on variable names
    - exhaustruct  # Requires all struct fields to be initialized
    - wrapcheck  # Too aggressive about wrapping errors
    - nlreturn  # Overly strict about newlines
    - wsl  # Overly strict about whitespace
    - gochecknoglobals  # Too strict for many use cases
    - gochecknoinits  # init() functions are sometimes necessary
    
run:
  timeout: 5m
    
issues:
  # Show all issues
  max-issues-per-linter: 0
  max-same-issues: 0
  
  # Skip directories and files
  exclude-dirs:
    - node_modules
    - _gotools
    - _build
  exclude-files:
    - ".*\\.gen\\.go$"
  
linters-settings:
  # Configure specific linters
  gocyclo:
    min-complexity: 15
  
  govet:
    enable-all: true
    
  lll:
    line-length: 150
    
  errcheck:
    check-type-assertions: true
    check-blank: true

