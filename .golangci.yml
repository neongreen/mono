version: "2"

linters:
  default: none
  enable:
  - modernize
  - unused
  - staticcheck
  - govet
  - errorlint
  - ineffassign
  # - nilerr  # Routinely flags graceful degradation patterns as bugs (e.g., fallback to UID when name lookup fails)
  settings:
    staticcheck:
      checks:
      - all
      - -QF1001  # De Morgan's law - whatever
      - -ST1003  # Don't complain about naming conventions 
    govet:
      enable-all: true
      disable:
        - shadow  # Don't complain about 'err' being shadowed
        - fieldalignment  # We don't care about field alignment
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - .*\.gen\.go$
      - node_modules
      - _gotools
      - _build
      - third_party$
      - builtin$
      - examples$
      - .dagger/internal/.*

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

