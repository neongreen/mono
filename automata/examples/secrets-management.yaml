# Secrets Management Examples
# Different ways to manage secrets with automata

version: 1

resources:
  # Environment variable (in shell profile)
  - type: secret
    name: GITHUB_TOKEN
    store: env
    prompt: "Create a Personal Access Token"
    url: https://github.com/settings/tokens
  
  # File-based secret (for config files)
  - type: secret
    name: API_KEY
    store: file
    path: ~/.config/myapp/api_key
    prompt: "Enter your API key"
    
  # Multiple secrets for the same service
  - type: secret
    name: AWS_ACCESS_KEY_ID
    store: env
    prompt: "AWS Access Key ID"
    url: https://console.aws.amazon.com/iam/home#/security_credentials
    
  - type: secret
    name: AWS_SECRET_ACCESS_KEY
    store: env
    prompt: "AWS Secret Access Key (from same page)"
    
  # Secret with validation
  - type: secret
    name: OPENAI_API_KEY
    store: env
    prompt: "OpenAI API Key (starts with sk-)"
    url: https://platform.openai.com/api-keys
    validate: "^sk-[A-Za-z0-9]{48}$"
