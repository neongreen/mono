app:
  title: Backstage
  baseUrl: http://localhost:3000
  signIn:
    providers:
      - guest
  hetzner:
    project:
      title: "Hetzner Cloud"
      owner: user:default/neongreen
      lifecycle: production

backend:
  baseUrl: http://localhost:7007
  listen:
    port: 7007
  csp:
    connect-src:
      - "'self'"
      - https://backstage.artyom.me

  database:
    client: better-sqlite3
    connection: ':memory:'

  cache:
    store: memory

  auth:
    keys:
      - secret: LOCAL_DEV_SECRET_CHANGE_IN_PRODUCTION_1234567890123456

  # hetzner:
  #   token: ${HCLOUD_TOKEN}
  #   entityProvider:
  #     schedule:
  #       frequency:
  #         minutes: 30
  #       timeout:
  #         minutes: 3

  cors:
    origin: http://localhost:3000
    methods: [GET, POST, PUT, DELETE]
    credentials: true

techdocs:
  builder: local
  generator:
    runIn: docker
  publisher:
    type: local

catalog:
  rules:
    - allow: [Component, System, API, Resource, Location, Template, User, Group]
  locations:
    - type: file
      target: /Users/artyom/code/neongreen/mono/backstage/catalog-info.yaml

auth:
  providers:
    guest:
      userEntityRef: user:default/guest
      ownershipEntityRefs:
        - user:default/guest
