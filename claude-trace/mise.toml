[tasks.run]
description = "Build and run claude-trace"
run = "go run ./cmd"

[tasks.test]
description = "Run tests for claude-trace"
run = "go test ./..."

[tasks.fmt]
description = "Format Go code"
run = "go fmt ./..."

[tasks.check]
description = "Check that Go code and tests compile and type check"
run = "go test -run=^$ ./..."
