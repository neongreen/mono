apiVersion: apps/v1
kind: Deployment
metadata:
  name: coder
  namespace: coder
  labels:
    app: coder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coder
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: coder
    spec:
      serviceAccountName: coder
      runtimeClassName: gvisor
      nodeSelector:
        kubernetes.io/hostname: mono
      containers:
        - name: coder
          image: ghcr.io/coder/coder:latest
          ports:
            - name: http
              containerPort: 7080
              protocol: TCP
          env:
            - name: CODER_ACCESS_URL
              value: "https://coder.cloud.artyom.me"
            - name: CODER_WILDCARD_ACCESS_URL
              value: "*.coder.cloud.artyom.me"
            - name: CODER_HTTP_ADDRESS
              value: "0.0.0.0:7080"
            - name: CODER_TELEMETRY_ENABLE
              value: "false"
            - name: CODER_PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: coder-secrets
                  key: POSTGRES_PASSWORD
            - name: CODER_PG_CONNECTION_URL
              value: "postgres://postgres:$(CODER_PG_PASSWORD)@postgres.postgres.svc.cluster.local:5432/coder?sslmode=disable"
          resources:
            requests:
              cpu: "250m"
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
      restartPolicy: Always
