# This file documents what secrets need to be created.
# DO NOT check actual secrets into git!
#
# Create secrets using fnox:
#
# 1. First, add the secrets to your keychain:
#    security add-generic-password -a fnox -s fnox -D "CODER_POSTGRES_PASSWORD" -w "your-password-here"
#
# 2. Then create the k8s secret (from cloud/ directory):
#    fnox exec -- kubectl create secret generic coder-secrets -n coder \
#      --from-literal=POSTGRES_PASSWORD="$CODER_POSTGRES_PASSWORD" \
#      --from-literal=POSTGRES_ADMIN_PASSWORD="$N8N_POSTGRES_ADMIN_PASSWORD"
#
# Required secrets in coder-secrets:
#   - POSTGRES_PASSWORD: Password for the 'coder' database user
#   - POSTGRES_ADMIN_PASSWORD: Root postgres password (same as n8n's admin password)
---
apiVersion: v1
kind: Secret
metadata:
  name: coder-secrets
  namespace: coder
type: Opaque
stringData:
  POSTGRES_PASSWORD: "REPLACE_ME"
  POSTGRES_ADMIN_PASSWORD: "REPLACE_ME"
