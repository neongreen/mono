---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
  namespace: onyx
  labels:
    app: api-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-server
  template:
    metadata:
      labels:
        app: api-server
    spec:
      nodeSelector:
        workload: onyx
      runtimeClassName: gvisor  # Run with container isolation
      initContainers:
        - name: db-migration
          image: onyxdotapp/onyx-backend:latest
          command: ["/bin/sh", "-c"]
          args:
            - "alembic upgrade head"
          envFrom:
            - configMapRef:
                name: onyx-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: onyx-secrets
                  key: POSTGRES_PASSWORD
            - name: SECRET
              valueFrom:
                secretKeyRef:
                  name: onyx-secrets
                  key: SECRET
      containers:
        - name: api-server
          image: onyxdotapp/onyx-backend:latest
          command: ["/bin/sh", "-c"]
          args:
            - "echo 'Starting Onyx Api Server' && uvicorn onyx.main:app --host 0.0.0.0 --port 8080"
          envFrom:
            - configMapRef:
                name: onyx-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: onyx-secrets
                  key: POSTGRES_PASSWORD
            - name: SECRET
              valueFrom:
                secretKeyRef:
                  name: onyx-secrets
                  key: SECRET
            - name: S3_AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: onyx-secrets
                  key: S3_AWS_SECRET_ACCESS_KEY
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: api-server-service
  namespace: onyx
spec:
  selector:
    app: api-server
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
