# This is a template. Actual secrets are managed via age encryption.
#
# Secrets are stored in cloud/fnox.toml with age encryption:
#   ONYX_POSTGRES_PASSWORD = { provider = "age", value = "..." }
#   ONYX_SECRET = { provider = "age", value = "..." }
#   ONYX_MINIO_ROOT_PASSWORD = { provider = "age", value = "..." }
#
# Deploy using: ./cloud/scripts/k8s-secrets.sh
#
# The script creates onyx-secrets with:
#   - POSTGRES_PASSWORD: Shared postgres password
#   - SECRET: Session encryption secret
#   - S3_AWS_SECRET_ACCESS_KEY: MinIO password

---
apiVersion: v1
kind: Secret
metadata:
  name: onyx-secrets
  namespace: onyx
type: Opaque
stringData:
  POSTGRES_PASSWORD: "REPLACE_ME"
  SECRET: "REPLACE_ME"
  S3_AWS_SECRET_ACCESS_KEY: "REPLACE_ME"
