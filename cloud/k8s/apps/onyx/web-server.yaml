---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-server
  namespace: onyx
  labels:
    app: web-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-server
  template:
    metadata:
      labels:
        app: web-server
    spec:
      nodeSelector:
        workload: onyx
      runtimeClassName: gvisor  # Run with container isolation
      containers:
        - name: web-server
          image: onyxdotapp/onyx-web-server:latest
          env:
            - name: INTERNAL_URL
              value: "http://api-server-service.onyx.svc.cluster.local:8080"
          ports:
            - containerPort: 3000
              name: http
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: web-server-service
  namespace: onyx
spec:
  selector:
    app: web-server
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  type: ClusterIP
