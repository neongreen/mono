apiVersion: v1
kind: Namespace
metadata:
  name: sample-apps
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-gvisor
  namespace: sample-apps
  labels:
    app: nginx-gvisor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-gvisor
  template:
    metadata:
      labels:
        app: nginx-gvisor
    spec:
      runtimeClassName: gvisor
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-gvisor
  namespace: sample-apps
spec:
  selector:
    app: nginx-gvisor
  ports:
    - port: 80
      targetPort: 80
