apiVersion: v1
kind: ConfigMap
metadata:
  name: backstage-config
  namespace: backstage
data:
  app-config.production.yaml: |
    app:
      baseUrl: https://backstage.artyom.me

    hetzner:
      project:
        title: Emily's Infrastructure
        owner: user:default/neongreen
        lifecycle: production

    backend:
      baseUrl: https://backstage.artyom.me
      listen:
        port: 7007
      csp:
        connect-src:
          - "'self'"
          - https://backstage.artyom.me
    
      database:
        client: pg
        connection:
          connectionString: ${DATABASE_URL}
        pluginDivisionMode: schema
    
      cache:
        store: memory
    
      auth:
        keys:
          - secret: ${APP_DEFAULT_AUTH_SECRET}

      hetzner:
        token: ${HCLOUD_TOKEN}

      cors:
        origin: https://backstage.artyom.me
        methods: [GET, POST, PUT, DELETE]
        credentials: true
    
    techdocs:
      builder: local
      generator:
        runIn: docker
      publisher:
        type: local
    
    catalog:
      rules:
        - allow: [Component, System, API, Resource, Location, Template, User, Group]
      locations:
        - type: file
          target: ./catalog-info.yaml
    
    kubernetes:
      serviceLocatorMethod:
        type: multiTenant
      clusterLocatorMethods:
        - type: config
          clusters:
            - name: mono-k3s
              url: https://91.98.238.65:6443
              authProvider: serviceAccount
              serviceAccountToken: ${BACKSTAGE_K8S_TOKEN}
              skipTLSVerify: false
              caData: ${BACKSTAGE_K8S_CA_DATA}
    
    auth:
      environment: production
      providers:
        github:
          development:
            clientId: ${GITHUB_OAUTH_CLIENT_ID}
            clientSecret: ${GITHUB_OAUTH_CLIENT_SECRET}
            signIn:
              resolvers:
                - resolver: usernameMatchingUserEntityName
          production:
            clientId: ${GITHUB_OAUTH_CLIENT_ID}
            clientSecret: ${GITHUB_OAUTH_CLIENT_SECRET}
            callbackUrl: https://backstage.artyom.me/api/auth/github/handler/frame
            signIn:
              resolvers:
                - resolver: usernameMatchingUserEntityName
