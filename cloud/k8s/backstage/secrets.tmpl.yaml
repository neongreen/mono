apiVersion: v1
kind: Secret
metadata:
  name: backstage-secrets
  namespace: backstage
type: Opaque
stringData:
  # Injected via `fnox exec -- envsubst`.
  SPACELIFT_API_KEY_ID: "${SPACELIFT_API_KEY_ID}"
  SPACELIFT_API_KEY_SECRET: "${SPACELIFT_API_KEY_SECRET}"
  HCLOUD_TOKEN: "${HCLOUD_TOKEN}"
  DO_API_TOKEN: "${DO_API_TOKEN}"
  GITHUB_TOKEN: "${GITHUB_TOKEN}"
  POSTGRES_PASSWORD: "${BACKSTAGE_DB_PASSWORD}"
  DATABASE_URL: "${DATABASE_URL}"
  APP_DEFAULT_AUTH_SECRET: "${APP_DEFAULT_AUTH_SECRET}"
  GITHUB_OAUTH_CLIENT_ID: "${GITHUB_OAUTH_CLIENT_ID}"
  GITHUB_OAUTH_CLIENT_SECRET: "${GITHUB_OAUTH_CLIENT_SECRET}"
  BACKSTAGE_K8S_TOKEN: "${BACKSTAGE_K8S_TOKEN}"
  BACKSTAGE_K8S_CA_DATA: "${BACKSTAGE_K8S_CA_DATA}"
