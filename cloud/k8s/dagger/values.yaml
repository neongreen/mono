# Dagger Engine Helm values
# See: https://github.com/dagger/dagger/tree/main/helm/dagger-engine

# Namespace for Dagger Engine
namespace: dagger

# Engine configuration
engine:
  # Number of replicas
  replicas: 1

  # Resource limits
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "2Gi"

# Service configuration
service:
  type: ClusterIP
  port: 8080

# Storage configuration (for Dagger cache)
storage:
  # Use local-path-provisioner (comes with k3s)
  storageClass: local-path
  size: 20Gi
