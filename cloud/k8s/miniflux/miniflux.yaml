apiVersion: v1
kind: ConfigMap
metadata:
  name: miniflux-config
  namespace: miniflux
data:
  BASE_URL: "http://miniflux.local/"
  LISTEN_ADDR: "0.0.0.0:8080"
  RUN_MIGRATIONS: "1"
  CREATE_ADMIN: "1"
  LOG_LEVEL: "info"
---
apiVersion: v1
kind: Secret
metadata:
  name: miniflux-credentials
  namespace: miniflux
type: Opaque
stringData:
  admin-username: admin
  admin-password: miniflux-admin-2024
  database-url: "postgres://miniflux:miniflux-postgres-pass-2024@postgres:5432/miniflux?sslmode=disable"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: miniflux
  namespace: miniflux
  labels:
    app: miniflux
spec:
  replicas: 1
  selector:
    matchLabels:
      app: miniflux
  template:
    metadata:
      labels:
        app: miniflux
    spec:
      runtimeClassName: gvisor
      containers:
        - name: miniflux
          image: miniflux/miniflux:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: miniflux-credentials
                  key: database-url
            - name: BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: miniflux-config
                  key: BASE_URL
            - name: LISTEN_ADDR
              valueFrom:
                configMapKeyRef:
                  name: miniflux-config
                  key: LISTEN_ADDR
            - name: RUN_MIGRATIONS
              valueFrom:
                configMapKeyRef:
                  name: miniflux-config
                  key: RUN_MIGRATIONS
            - name: CREATE_ADMIN
              valueFrom:
                configMapKeyRef:
                  name: miniflux-config
                  key: CREATE_ADMIN
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: miniflux-credentials
                  key: admin-username
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: miniflux-credentials
                  key: admin-password
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: miniflux-config
                  key: LOG_LEVEL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: miniflux
  namespace: miniflux
spec:
  selector:
    app: miniflux
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
