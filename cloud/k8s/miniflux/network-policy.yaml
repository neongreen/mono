# Default deny all traffic in the miniflux namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: miniflux
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Allow miniflux to connect to postgres
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: miniflux-to-postgres
  namespace: miniflux
spec:
  podSelector:
    matchLabels:
      app: miniflux
  policyTypes:
    - Egress
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
    # Allow connection to postgres
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    # Allow outbound HTTP/HTTPS for fetching RSS feeds
    - ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
---
# Allow postgres to accept connections from miniflux
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
  namespace: miniflux
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: miniflux
      ports:
        - protocol: TCP
          port: 5432
---
# Allow external access to miniflux (for port-forward or ingress)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: miniflux-ingress
  namespace: miniflux
spec:
  podSelector:
    matchLabels:
      app: miniflux
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
