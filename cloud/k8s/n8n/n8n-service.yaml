apiVersion: v1
kind: Service
metadata:
  labels:
    service: n8n
  name: n8n
  namespace: n8n
spec:
  # Changed to NodePort to work around port-forward issues
  # Access via: http://<node-ip>:30678
  type: NodePort
  ports:
    - name: "5678"
      port: 5678
      targetPort: 5678
      nodePort: 30678
      protocol: TCP
  selector:
    service: n8n
