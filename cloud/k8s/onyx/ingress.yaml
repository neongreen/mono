---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: onyx-ingress
  namespace: onyx
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"  # Assuming cert-manager is set up
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - onyx.cloud.artyom.me
      secretName: onyx-tls
  rules:
    - host: onyx.cloud.artyom.me
      http:
        paths:
          # API endpoints go to api-server
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-server-service
                port:
                  number: 8080
          # MCP server endpoints
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: mcp-server-service
                port:
                  number: 8090
          # Everything else goes to web-server (Next.js frontend)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-server-service
                port:
                  number: 3000
