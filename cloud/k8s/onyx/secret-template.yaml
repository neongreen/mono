# This is a template. Actual secrets should be created using fnox.
# Add the following to cloud/fnox.toml:
#
# # Onyx secrets
# ONYX_POSTGRES_PASSWORD = { provider = "keychain", value = "ONYX_POSTGRES_PASSWORD" }
# ONYX_SECRET = { provider = "keychain", value = "ONYX_SECRET" }
# ONYX_MINIO_ROOT_PASSWORD = { provider = "keychain", value = "ONYX_MINIO_ROOT_PASSWORD" }
#
# Then create the secret with:
# fnox exec -- kubectl create secret generic onyx-secrets -n onyx \
#   --from-literal=POSTGRES_PASSWORD="$ONYX_POSTGRES_PASSWORD" \
#   --from-literal=SECRET="$ONYX_SECRET" \
#   --from-literal=S3_AWS_SECRET_ACCESS_KEY="$ONYX_MINIO_ROOT_PASSWORD"

---
apiVersion: v1
kind: Secret
metadata:
  name: onyx-secrets
  namespace: onyx
type: Opaque
# Note: In production, this would be created via fnox exec, not committed to git
# Keeping this here as documentation
stringData:
  POSTGRES_PASSWORD: "REPLACE_WITH_ACTUAL_PASSWORD"
  SECRET: "REPLACE_WITH_ACTUAL_SECRET"  # For session encryption
  S3_AWS_SECRET_ACCESS_KEY: "REPLACE_WITH_ACTUAL_MINIO_PASSWORD"
