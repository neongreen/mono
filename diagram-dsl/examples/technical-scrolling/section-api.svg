        <text x="145" y="579.1666666666666" font-size="14" font-family="Monaco, Courier, monospace" fill="black" font-weight="bold" text-anchor="start">/api/v1/users</text>
        <text x="76" y="626.3333333333334" font-size="13" font-family="Arial, sans-serif" fill="black" font-weight="normal" text-anchor="start">Create a new user</text>
        <text x="76" y="668" font-size="12" font-family="Arial, sans-serif" fill="#666" font-weight="bold" text-anchor="start">REQUEST</text>
