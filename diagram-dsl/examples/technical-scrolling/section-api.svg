        <text x="76" y="269" font-size="12" font-family="Arial, sans-serif" fill="#666" font-weight="bold" text-anchor="start">REQUEST</text>
          <text x="76" y="290.1666666666667" font-size="11" font-family="Arial, sans-serif" fill="black" font-weight="bold" text-anchor="start">Parameters:</text>
          <text x="76" y="304.6666666666667" font-size="11" font-family="Monaco, Courier, monospace" fill="black" font-weight="normal" text-anchor="start">  id: string (UUID)</text>
        <text x="76" y="347.5" font-size="12" font-family="Arial, sans-serif" fill="#666" font-weight="bold" text-anchor="start">RESPONSE</text>
          <rect x="76" y="360" width="35" height="17" fill="#e8f5e9" rx="4" />
            <text x="84" y="372.1666666666667" font-size="11" font-family="Arial, sans-serif" fill="#2e7d32" font-weight="bold" text-anchor="start">200</text>
        <rect x="76" y="389" width="768" height="91" fill="#1e1e1e" rx="4" />
          <text x="88" y="438.1666666666667" font-size="11" font-family="Monaco, Courier, monospace" fill="#d4d4d4" font-weight="normal" text-anchor="start">{
  &quot;id&quot;: &quot;123&quot;,
  &quot;name&quot;: &quot;John Doe&quot;,
  &quot;email&quot;: &quot;john@example.com&quot;
}</text>
    <rect x="60" y="548" width="800" height="428" fill="transparent" stroke="#2e7d32" stroke-width="2" rx="8" />
      <rect x="60" y="548" width="800" height="53" fill="#e8f5e9" />
        <rect x="76" y="564" width="57" height="21" fill="#1b5e20" rx="4" />
