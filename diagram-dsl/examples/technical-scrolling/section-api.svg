          <rect x="76" y="696" width="768" height="91" fill="#1e1e1e" rx="4" />
            <text x="88" y="745.1666666666666" font-size="11" font-family="Monaco, Courier, monospace" fill="#d4d4d4" font-weight="normal" text-anchor="start">{
