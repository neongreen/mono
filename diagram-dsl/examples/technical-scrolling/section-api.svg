    <text x="235.5" y="89" font-size="36" font-family="Arial, sans-serif" fill="#212121" font-weight="bold" text-anchor="middle">REST API Endpoints</text>
    <rect x="60" y="146" width="800" height="350" fill="transparent" stroke="#1976d2" stroke-width="2" rx="8" />
      <rect x="60" y="146" width="800" height="53" fill="#e3f2fd" />
        <rect x="76" y="162" width="49" height="21" fill="#1565c0" rx="4" />
          <text x="88" y="176.5" font-size="12" font-family="Arial, sans-serif" fill="white" font-weight="bold" text-anchor="start">GET</text>
        <text x="137" y="177.16666666666666" font-size="14" font-family="Monaco, Courier, monospace" fill="black" font-weight="bold" text-anchor="start">/api/v1/users/:id</text>
