          <text x="96" y="241.33333333333334" font-size="10" font-family="Arial, sans-serif" fill="#808080" font-weight="normal" text-anchor="start">// Go</text>
          <text x="96" y="259.6666666666667" font-size="11" font-family="Monaco, Consolas, monospace" fill="#d4d4d4" font-weight="normal" text-anchor="start"> 1  func (h *Handler) GetUser(w http.ResponseWriter, r *http.Request) {</text>
          <text x="96" y="271.6666666666667" font-size="11" font-family="Monaco, Consolas, monospace" fill="#d4d4d4" font-weight="normal" text-anchor="start"> 2      id := chi.URLParam(r, &quot;id&quot;)</text>
          <text x="96" y="282.1666666666667" font-size="11" font-family="Monaco, Consolas, monospace" fill="#d4d4d4" font-weight="normal" text-anchor="start"> 3      </text>
          <text x="96" y="292.6666666666667" font-size="11" font-family="Monaco, Consolas, monospace" fill="#d4d4d4" font-weight="normal" text-anchor="start"> 4      user, err := h.userService.GetByID(r.Context(), id)</text>
          <text x="96" y="304.1666666666667" font-size="11" font-family="Monaco, Consolas, monospace" fill="#d4d4d4" font-weight="normal" text-anchor="start"> 5      if err != nil {</text>
          <text x="96" y="315.6666666666667" font-size="11" font-family="Monaco, Consolas, monospace" fill="#d4d4d4" font-weight="normal" text-anchor="start"> 6          http.Error(w, err.Error(), http.StatusNotFound)</text>
          <text x="96" y="326.1666666666667" font-size="11" font-family="Monaco, Consolas, monospace" fill="#d4d4d4" font-weight="normal" text-anchor="start"> 7          return</text>
          <text x="96" y="336.1666666666667" font-size="11" font-family="Monaco, Consolas, monospace" fill="#d4d4d4" font-weight="normal" text-anchor="start"> 8      }</text>
          <text x="96" y="346.1666666666667" font-size="11" font-family="Monaco, Consolas, monospace" fill="#d4d4d4" font-weight="normal" text-anchor="start"> 9      </text>
          <text x="96" y="356.6666666666667" font-size="11" font-family="Monaco, Consolas, monospace" fill="#d4d4d4" font-weight="normal" text-anchor="start">10      json.NewEncoder(w).Encode(user)</text>
          <text x="96" y="368.1666666666667" font-size="11" font-family="Monaco, Consolas, monospace" fill="#d4d4d4" font-weight="normal" text-anchor="start">11  }</text>
