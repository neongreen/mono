      <text x="80" y="221.16666666666666" font-size="14" font-family="Arial, sans-serif" fill="#1565c0" font-weight="bold" text-anchor="start">New Components</text>
        <text x="80" y="245.33333333333334" font-size="13" font-family="Arial, sans-serif" fill="black" font-weight="normal" text-anchor="start">• Slide - Consistent slide container,</text>
