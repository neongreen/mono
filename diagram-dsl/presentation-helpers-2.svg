    <rect x="60" y="146" width="1000" height="97" fill="#fafafa" stroke="#e0e0e0" stroke-width="2" rx="8" />
          <text x="416" y="171.33333333333334" font-size="13" font-family="Arial, sans-serif" fill="#2e7d32" font-weight="bold" text-anchor="start">✓ Pros</text>
          <text x="416" y="189.16666666666666" font-size="11" font-family="Arial, sans-serif" fill="black" font-weight="normal" text-anchor="start">• Simple to implement</text>
          <text x="416" y="208.16666666666666" font-size="11" font-family="Arial, sans-serif" fill="black" font-weight="normal" text-anchor="start">• Consistent styling</text>
          <text x="416" y="226.16666666666666" font-size="11" font-family="Arial, sans-serif" fill="black" font-weight="normal" text-anchor="start">• Less code to write</text>
