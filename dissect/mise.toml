[tools]
go = "1.24.4"
gotestsum = "latest"
"go:golang.org/x/tools/gopls" = "latest"

[tasks."test"]
description = "Run tests"
run = "gotestsum"

[tasks."build"]
description = "Build the project into _build/dissect"
# -trimpath strips the build dir path from AddSource and leaves only relative paths
run = "go build -trimpath -o _build/dissect ./cmd"

[tasks."fetch-gotools"]
description = "Fetch Go tools (including gopls) for AI to inspect"
run = "git clone https://github.com/golang/tools.git _gotools"

[tasks."run"]
description = "Run the project"
depends = ["build"]
run = """
DIR="$(pwd)"
cd {{cwd}}
"$DIR/_build/dissect"
"""

[tasks."fmt"]
description = "Format Go code"
run = "golangci-lint fmt ./..."

[tasks."check"]
description = "Check that Go code and tests compile and type check"
run = "go test -run=^$ ./..."
