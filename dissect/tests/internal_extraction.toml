# This test checks that non-exported functions are moved to internal/<filename>/

[files_in]
"go.mod" = '''
module dissect_sample_project

go 1.20
'''

"foo/foo.go" = '''
package foo

import "fmt"

func myFunc() string {
	return "Hello from myFunc!"
}

func ExportedFunc() string {
	return "Hello from ExportedFunc!"
}

func CallFunctions() {
	fmt.Println(myFunc())
	fmt.Println(ExportedFunc())
}
'''

