[tools]
go = "1.24.7"

[tasks.run]
description = "Build and run jj-run"
run = "go run ./cmd"

[tasks.test]
description = "Run all tests"
run = "go test -v ./..."

[tasks.build]
description = "Build jj-run binary"
run = "go build -o jj-run ./cmd"

[tasks.fmt]
description = "Format Go code"
run = "golangci-lint fmt ./..."
