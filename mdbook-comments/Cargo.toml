[package]
name = "mdbook-comments"
version = "0.1.0"
edition = "2021"
authors = ["mdbook-comments contributors"]
description = "An mdbook preprocessor for adding paragraph-level comments"
license = "MIT"

[dependencies]
mdbook = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
