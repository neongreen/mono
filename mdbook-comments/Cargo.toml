[package]
name = "mdbook-comments"
version = "0.1.0"
edition = "2021"
authors = ["mdbook-comments contributors"]
description = "An mdbook preprocessor for adding paragraph-level comments"
license = "MIT"
build = "build.rs"

[dependencies]
mdbook = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
sha2 = "0.10"
hex = "0.4"
rust-embed = "8.0"
pulldown-cmark = "0.9"
pulldown-cmark-to-cmark = "10.0"
