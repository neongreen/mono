[book]
authors = ["mdbook-comments contributors"]
language = "en"
multilingual = false
src = "src"
title = "Example Book with Comments"

[preprocessor.comments]
command = "mdbook-comments"
api-url = "http://localhost:3000/api"
auth-type = "cookie"
backend-type = "json-server"
similarity-threshold = 0.85
orphaned-comments-location = "end-of-chapter"

[preprocessor.comments.elements]
paragraphs = true
lists = true
blockquotes = true
code-blocks = true
tables = true
headings = false

[preprocessor.comments.ui]
link-text = "comment"
show-comment-count = true

[output.html]
additional-js = [
    "json-server-config.js"
]
input = "src"
