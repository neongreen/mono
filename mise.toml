experimental_monorepo_root = true

[tools]
go = "1.24.7"
"go:github.com/steveyegge/beads/cmd/bd" = "latest"

[tasks.cloc]
description = "Count lines of Go code by file"
run = "cloc --by-file --include-lang=Go ."

[tasks."jj:track"]
description = "Track all remote bookmarks"
run = """
jj git fetch && jj b t "glob:*@origin"
"""

[tasks."lint:actions"]
description = "Lint GitHub Actions workflows with actionlint"
run = "go run github.com/rhysd/actionlint/cmd/actionlint@latest"

[tasks."lint:actions-pinned"]
description = "Verify GitHub Actions are pinned to commit SHAs"
run = "go run github.com/suzuki-shunsuke/pinact/v3/cmd/pinact@latest run --check"
