          <text x="360" y="487.3333333333333" font-size="13" font-family="Arial, sans-serif" fill="#2e7d32" font-weight="bold" text-anchor="start">✓ Pros</text>
          <text x="360" y="505.1666666666667" font-size="11" font-family="Arial, sans-serif" fill="black" font-weight="normal" text-anchor="start">• Simple to implement</text>
          <text x="360" y="524.1666666666666" font-size="11" font-family="Arial, sans-serif" fill="black" font-weight="normal" text-anchor="start">• Predictable token usage</text>
          <text x="360" y="543.1666666666666" font-size="11" font-family="Arial, sans-serif" fill="black" font-weight="normal" text-anchor="start">• Low computational cost</text>
