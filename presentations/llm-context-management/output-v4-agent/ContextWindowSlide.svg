        <rect x="190" y="626" width="240" height="20" fill="#e0e0e0" stroke="#bdbdbd" stroke-width="1" rx="4" />
        <rect x="190" y="626" width="219.7265625" height="20" fill="#f44336" rx="4" />
        <text x="310" y="661" font-size="12" text-anchor="middle" fill="#616161">3,750 / 4,096 tokens (91.6%)</text>
        <rect x="470" y="591" width="260" height="100" fill="#f5f5f5" stroke="#757575" stroke-width="2" rx="6" />
        <text x="600" y="611" font-size="14" text-anchor="middle" font-weight="bold">Output Budget</text>
        <rect x="480" y="626" width="240" height="20" fill="#e0e0e0" stroke="#bdbdbd" stroke-width="1" rx="4" />
        <rect x="480" y="626" width="40.546875" height="20" fill="#4caf50" rx="4" />
        <text x="600" y="661" font-size="12" text-anchor="middle" fill="#616161">346 / 2,048 tokens (16.9%)</text>
        <rect x="760" y="591" width="260" height="100" fill="#f5f5f5" stroke="#757575" stroke-width="2" rx="6" />
        <text x="890" y="611" font-size="14" text-anchor="middle" font-weight="bold">Est. Cost</text>
