    <text x="268" y="89" font-size="36" font-family="Arial, sans-serif" fill="#212121" font-weight="bold" text-anchor="middle">Context Window Budget</text>
    <text x="204.5" y="136" font-size="12" font-family="Arial, sans-serif" fill="#757575" font-weight="normal" text-anchor="middle">How tokens are allocated across different components</text>
      <rect x="150" y="210" width="900" height="120" fill="white" stroke="#757575" stroke-width="2" rx="6" />
