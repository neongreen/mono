      <text x="445.3125" y="280" font-size="10" text-anchor="middle" fill="#424242">2400 (58.6%)</text>
      <rect x="709.8125" y="212" width="196.875" height="116" fill="#a3be8c" fill-opacity="0.7" />
      <text x="806.25" y="265" font-size="11" text-anchor="middle" font-weight="500">Retrieved Context</text>
      <text x="806.25" y="280" font-size="10" text-anchor="middle" fill="#424242">900 (22.0%)</text>
      <rect x="906.6875" y="212" width="65.625" height="116" fill="#ebcb8b" fill-opacity="0.7" />
      <text x="937.5" y="265" font-size="11" text-anchor="middle" font-weight="500">User Query</text>
      <text x="937.5" y="280" font-size="10" text-anchor="middle" fill="#424242">300 (7.3%)</text>
      <rect x="972.3125" y="212" width="75.6875" height="116" fill="#d8dee9" fill-opacity="0.7" />
      <text x="1008.15625" y="265" font-size="11" text-anchor="middle" font-weight="500">Reserved for Output</text>
      <text x="1008.15625" y="280" font-size="10" text-anchor="middle" fill="#424242">346 (8.4%)</text>
        <rect x="180" y="410" width="400" height="80" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="8" />
          <text x="380" y="445.1666666666667" font-size="20" font-family="Arial, sans-serif" fill="#212121" font-weight="bold" text-anchor="middle">💡 Key Insight</text>
          <text x="105" y="471.8333333333333" font-size="13" font-family="Arial, sans-serif" fill="black" font-weight="normal" text-anchor="start">Each component competes for limited token budget. Smart allocation is crucial for performance.</text>
        <rect x="620" y="410" width="400" height="80" fill="#fff3e0" stroke="#f57c00" stroke-width="2" rx="8" />
          <text x="820.5" y="445.1666666666667" font-size="20" font-family="Arial, sans-serif" fill="#212121" font-weight="bold" text-anchor="middle">⚠️ Trade-offs</text>
          <text x="605" y="471.8333333333333" font-size="13" font-family="Arial, sans-serif" fill="black" font-weight="normal" text-anchor="start">More context = better accuracy but higher cost and latency. Balance is key.</text>
      <rect x="150" y="540" width="900" height="1" fill="#ddd" />
        <rect x="180" y="591" width="260" height="100" fill="#f5f5f5" stroke="#757575" stroke-width="2" rx="6" />
