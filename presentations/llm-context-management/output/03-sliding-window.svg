            <text x="517" y="512.1666666666666" font-size="11" font-family="Arial, sans-serif" fill="black" font-weight="normal" text-anchor="start">• Loses important history</text>
            <text x="517" y="530.1666666666666" font-size="11" font-family="Arial, sans-serif" fill="black" font-weight="normal" text-anchor="start">• No semantic awareness</text>
            <text x="517" y="548.1666666666666" font-size="11" font-family="Arial, sans-serif" fill="black" font-weight="normal" text-anchor="start">• Context can break mid-topic</text>
