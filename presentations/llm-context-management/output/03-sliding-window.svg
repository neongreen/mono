        <text x="510.5" y="484.1666666666667" font-size="14" font-family="Arial, sans-serif" fill="#212121" font-weight="normal" text-anchor="middle">Pros &amp; Cons</text>
            <text x="360" y="494.3333333333333" font-size="13" font-family="Arial, sans-serif" fill="#2e7d32" font-weight="bold" text-anchor="start">✓ Pros</text>
            <text x="360" y="512.1666666666666" font-size="11" font-family="Arial, sans-serif" fill="black" font-weight="normal" text-anchor="start">• Simple to implement</text>
            <text x="360" y="531.1666666666666" font-size="11" font-family="Arial, sans-serif" fill="black" font-weight="normal" text-anchor="start">• Predictable token usage</text>
            <text x="360" y="550.1666666666666" font-size="11" font-family="Arial, sans-serif" fill="black" font-weight="normal" text-anchor="start">• Low computational cost</text>
