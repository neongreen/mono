binary = "claude-trace"
test_args = ["--help"]

[[mirror.projects]]
name = "tk"
desc = "System-wide event-sourced task tracker with claims-based authority."
homepage = "https://github.com/neongreen/mono/tree/main/tk"
binary = "tk"
