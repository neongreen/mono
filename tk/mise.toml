[tasks.run]
description = "Build and run"
run = "go run ./cmd"

[tasks.fmt]
description = "Format Go code"
run = "go fmt ./..."

[tasks.check]
description = "Check that Go code and tests compile and type check"
run = "go test -run=^$ ./..."

[tasks.test]
description = "Run tests"
run = "go test ./..."
